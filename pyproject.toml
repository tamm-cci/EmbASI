[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "embasi"
version = "0.5.0"
authors = [
        {name="Gabriel Bramley", email="BramleyG@cardiff.ac.uk"},
]
description = "A generalised workflow for QM/QM Embedding"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.9"
classifiers = [
            "Programming Language :: Python :: 3",
            "License :: OSI Approved :: MIT License",
            "Operating System :: OS Independent",
]
dependencies = [
             "mpi4py",
	     "scalapack4py @ git+https://gitlab.com/pvst/scalapack4py.git@v1.0_release",
             "asi4py @ git+https://gitlab.com/pvst/asi.git@doc_corrections#egg=pkg&subdirectory=pyasi",
             "ase>=3.24.0",
	     "pyscf>=2.8.0",
]


[project.urls]
Homepage = "https://github.com/logsdail/EmbASI"
Issues = "https://github.com/logsdail/EmbASI/issues"

[tool.setuptools]
packages = ["embasi"]